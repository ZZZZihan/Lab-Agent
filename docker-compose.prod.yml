services:
  api:
    environment:
      APP_ENV: prod
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOAD_TUNED_CONFIG: "true"

  web:
    build:
      args:
        NEXT_PUBLIC_DEMO_HINTS: "false"
    environment:
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      NEXT_PUBLIC_DEMO_HINTS: "false"
