services:
  postgres:
    healthcheck:
      interval: 1s
      timeout: 3s
      retries: 60

  redis:
    healthcheck:
      interval: 1s
      timeout: 3s
      retries: 60

  api-init:
    image: ${LAB_AGENT_API_IMAGE:-lab-agent-api:local}

  api:
    image: ${LAB_AGENT_API_IMAGE:-lab-agent-api:local}
    environment:
      LLM_PROVIDER: fake
      LLM_MODEL: fake-grounded-v1
      LLM_API_KEY_FILE: ""
      EMBEDDER: hashing
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      EMBEDDING_MODEL_VERSION: ""
      EMBEDDING_DIM: "512"
      EMBEDDING_STORAGE: vector
      EMBEDDING_INDEX: auto
      EMBEDDING_QUERY_TEMPLATE: "{query}"
      EMBEDDING_QUERY_INSTRUCTION: ""
      EMBEDDING_DOCUMENT_PREFIX: ""
      EMBEDDING_REDACT: "false"
      EVIDENCE_SCORE_MIN: "0.30"
      RARE_COVERAGE_MIN: "0.35"
    healthcheck:
      interval: 1s
      timeout: 3s
      retries: 90

  web:
    image: ${LAB_AGENT_WEB_IMAGE:-lab-agent-web:local}
    healthcheck:
      interval: 1s
      timeout: 3s
      retries: 60

secrets:
  magpie_key:
    file: ./docker/empty-secret
