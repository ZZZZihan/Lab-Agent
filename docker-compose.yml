services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: labagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: labagent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labagent -d labagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://labagent:${POSTGRES_PASSWORD}@postgres:5432/labagent
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://127.0.0.1:43123,http://localhost:43123
      UPLOAD_DIR: /app/data/uploads
      LOAD_TUNED_CONFIG: "true"
      TUNED_CONFIG_PATH: /opt/lab-agent/evals/data/v1/selected_config.json
      CORPUS_DIR: /opt/lab-agent/evals/data/v1/corpus
      SEED_ONLY_DIR: /opt/lab-agent/evals/data/v1/seed_only
    ports:
      - "127.0.0.1:43124:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3)); sys.exit(0 if r.get('database') and r.get('redis') else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Local demo only. A production image build leaves this false.
        NEXT_PUBLIC_DEMO_HINTS: "true"
    environment:
      API_INTERNAL_URL: http://api:8000
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_DEMO_HINTS: "true"
    ports:
      - "127.0.0.1:43123:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
  uploads:
