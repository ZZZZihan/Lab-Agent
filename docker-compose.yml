services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: yanzheng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: yanzheng
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanzheng -d yanzheng"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://yanzheng:${POSTGRES_PASSWORD}@postgres:5432/yanzheng
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://127.0.0.1:43123,http://localhost:43123
      UPLOAD_DIR: /app/data/uploads
      LOAD_TUNED_CONFIG: "true"
      TUNED_CONFIG_PATH: /opt/yanzheng/evals/data/v1/selected_config.json
      CORPUS_DIR: /opt/yanzheng/evals/data/v1/corpus
      SEED_ONLY_DIR: /opt/yanzheng/evals/data/v1/seed_only
    ports:
      - "43124:8000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Local demo only. A production image build leaves this false.
        NEXT_PUBLIC_DEMO_HINTS: "true"
    environment:
      API_INTERNAL_URL: http://api:8000
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_DEMO_HINTS: "true"
    ports:
      - "43123:3000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
