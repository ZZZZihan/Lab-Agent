services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: labagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: labagent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labagent -d labagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    restart: "no"
    command: ["api-entrypoint.sh", "--init-only"]
    secrets:
      - magpie_key
    volumes:
      - uploads:/app/data/uploads
      - calibrations:/app/data/calibrations
      - api_secrets:/run/lab-agent-secrets

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+asyncpg://labagent:${POSTGRES_PASSWORD}@postgres:5432/labagent
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}
      CORS_ORIGINS: http://127.0.0.1:43123,http://localhost:43123
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:3425/v1}
      LLM_API_KEY_FILE: /run/lab-agent-secrets/magpie_key
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      UPLOAD_DIR: /app/data/uploads
      CALIBRATION_DIR: /app/data/calibrations
      LOAD_TUNED_CONFIG: "true"
      CORPUS_DIR: /opt/lab-agent/evals/data/v1/corpus
      SEED_ONLY_DIR: /opt/lab-agent/evals/data/v1/seed_only
    secrets:
      - magpie_key
    ports:
      - "127.0.0.1:43124:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data/uploads
      - calibrations:/app/data/calibrations
      - api_secrets:/run/lab-agent-secrets:ro
    depends_on:
      api-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3)); sys.exit(0 if r.get('database') and r.get('redis') else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Local demo only. A production image build sets this to false.
        NEXT_PUBLIC_DEMO_HINTS: ${NEXT_PUBLIC_DEMO_HINTS:-true}
    environment:
      API_INTERNAL_URL: http://api:8000
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:43123,http://localhost:43123}
      NEXT_PUBLIC_DEMO_HINTS: ${NEXT_PUBLIC_DEMO_HINTS:-true}
    ports:
      - "127.0.0.1:43123:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
  uploads:
  calibrations:
  api_secrets:

secrets:
  magpie_key:
    file: ${LAB_AGENT_MAGPIE_KEY_FILE:-~/.config/lab-agent/magpie.key}

