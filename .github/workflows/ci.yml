name: ci

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action scans base^..head on push and pull_request. That
      # revision does not exist when base is the root commit, and it skips
      # history outside the event range. Install a pinned gitleaks and scan
      # every commit in this checkout instead.
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/gitleaks" version
      - name: Scan full git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner --log-opts=--all

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: labagent
          POSTGRES_PASSWORD: labagent
          POSTGRES_DB: labagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labagent -d labagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create the test database
        run: PGPASSWORD=labagent psql -h 127.0.0.1 -U labagent -d labagent -c "CREATE DATABASE labagent_test" || true
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Lint and types
        working-directory: backend
        run: uv run ruff check app evals tests && uv run mypy app evals
      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://labagent:labagent@127.0.0.1:5432/labagent_test
        run: uv run pytest -q
      - name: Eval drift
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://labagent:labagent@127.0.0.1:5432/labagent
          JWT_SECRET: ci-only-jwt-secret-value-0123456789-abcdef
          APP_ENV: test
          EMBEDDER: hashing
          LLM_PROVIDER: fake
          LOAD_TUNED_CONFIG: "true"
        run: uv run python -m evals.run_eval --check
      - name: Dependency audit
        working-directory: backend
        run: uv run pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint && npx tsc --noEmit
      - working-directory: frontend
        run: npm audit --audit-level=high
