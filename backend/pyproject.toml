[project]
name = "yanzheng"
version = "0.1.0"
description = "Evidence-grounded research-lab knowledge agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "redis>=5.2",
  "httpx>=0.28",
  "python-multipart>=0.0.18",
  "pyjwt[crypto]>=2.10",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "mcp>=1.2",
  "jieba>=0.42.1",
  "pypdf>=5.1",
]

[project.optional-dependencies]
bge = ["sentence-transformers>=3.3"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "fakeredis>=2.26",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
packages = ["app", "evals"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
